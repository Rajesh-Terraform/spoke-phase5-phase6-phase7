name: Apply phases 5, 6, and 7

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose plan only or apply all enabled phases to AWS."
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.action == 'apply' && 'Apply phases 5, 6, and 7' || 'Plan phases 5, 6, and 7' }}
    if: inputs.action != 'apply' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME || 'spoke' }}
      TF_VAR_vpc_cidr_block: ${{ vars.TF_VAR_VPC_CIDR_BLOCK || '10.20.0.0/16' }}
      TF_VAR_availability_zones: ${{ vars.TF_VAR_AVAILABILITY_ZONES || '[]' }}
      TF_VAR_public_subnet_cidrs: ${{ vars.TF_VAR_PUBLIC_SUBNET_CIDRS || '["10.20.1.0/24","10.20.2.0/24"]' }}
      TF_VAR_private_subnet_cidrs: ${{ vars.TF_VAR_PRIVATE_SUBNET_CIDRS || '["10.20.11.0/24","10.20.12.0/24"]' }}
      TF_VAR_hub_peering: ${{ vars.TF_VAR_HUB_PEERING || '{"enabled":false,"vpc_id":"","cidr_block":"","route_table_ids":[]}' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Check AWS deployment configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            printf '::error::Set AWS_ROLE_ARN in GitHub Actions secrets or variables before deploying.\n'
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Create or find Terraform state backend
        id: backend
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE || vars.TF_STATE_LOCK_TABLE }}
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          bucket="${TF_STATE_BUCKET:-spoke-phase567-tfstate-${account_id}-${AWS_REGION}}"
          lock_table="${TF_STATE_LOCK_TABLE:-spoke-phase567-tf-lock}"

          if ! aws s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
            if [[ "$AWS_REGION" == "us-east-1" ]]; then
              aws s3api create-bucket --bucket "$bucket" --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$bucket" \
                --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
          fi

          aws s3api put-bucket-versioning \
            --bucket "$bucket" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "$bucket" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block \
            --bucket "$bucket" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          if ! aws dynamodb describe-table --table-name "$lock_table" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$lock_table" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$lock_table"
          fi

          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "lock_table=$lock_table" >> "$GITHUB_OUTPUT"

      - name: Initialize remote state
        env:
          TF_STATE_BUCKET: ${{ steps.backend.outputs.bucket }}
          TF_STATE_LOCK_TABLE: ${{ steps.backend.outputs.lock_table }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
        run: >-
          terraform init -reconfigure -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=spoke-phase5-phase6-phase7/terraform.tfstate"
          -backend-config="region=$AWS_REGION"
          -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE"
          -backend-config="encrypt=true"

      - name: Create full Terraform plan
        if: inputs.action == 'plan'
        run: terraform plan -input=false -out=tfplan

      - name: Read phase 7 setting
        id: phase7
        if: inputs.action == 'apply'
        env:
          TF_VAR_HUB_PEERING: ${{ vars.TF_VAR_HUB_PEERING || '{"enabled":false,"vpc_id":"","cidr_block":"","route_table_ids":[]}' }}
        run: echo "enabled=$(jq -r '.enabled' <<< "$TF_VAR_HUB_PEERING")" >> "$GITHUB_OUTPUT"

      - name: Phase 5 - plan VPC and subnets
        if: inputs.action == 'apply'
        run: terraform plan -input=false -target=module.phase5_vpc -out=phase5.tfplan

      - name: Phase 5 - apply VPC and subnets
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve phase5.tfplan

      - name: Phase 6 - plan internet and NAT routing
        if: inputs.action == 'apply'
        run: terraform plan -input=false -target=module.phase6_routing -out=phase6.tfplan

      - name: Phase 6 - apply internet and NAT routing
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve phase6.tfplan

      - name: Phase 7 - plan hub peering
        if: inputs.action == 'apply' && steps.phase7.outputs.enabled == 'true'
        run: terraform plan -input=false -target=module.phase7_hub_peering -out=phase7.tfplan

      - name: Phase 7 - apply hub peering
        if: inputs.action == 'apply' && steps.phase7.outputs.enabled == 'true'
        run: terraform apply -input=false -auto-approve phase7.tfplan

      - name: Verify complete Terraform configuration
        if: inputs.action == 'apply'
        run: terraform plan -input=false
