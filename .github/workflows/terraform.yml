name: Terraform

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: "Choose plan or apply. Apply changes AWS resources."
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read

jobs:
  validate:
    name: Validate phases 5-7
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize providers
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate

  deploy:
    name: Terraform ${{ inputs.action }}
    if: github.event_name == 'workflow_dispatch' && (inputs.action != 'apply' || github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    environment: terraform
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_project_name: ${{ vars.TF_VAR_PROJECT_NAME || 'spoke' }}
      TF_VAR_vpc_cidr_block: ${{ vars.TF_VAR_VPC_CIDR_BLOCK || '10.20.0.0/16' }}
      TF_VAR_availability_zones: ${{ vars.TF_VAR_AVAILABILITY_ZONES || '[]' }}
      TF_VAR_public_subnet_cidrs: ${{ vars.TF_VAR_PUBLIC_SUBNET_CIDRS || '["10.20.1.0/24","10.20.2.0/24"]' }}
      TF_VAR_private_subnet_cidrs: ${{ vars.TF_VAR_PRIVATE_SUBNET_CIDRS || '["10.20.11.0/24","10.20.12.0/24"]' }}
      TF_VAR_hub_peering: ${{ vars.TF_VAR_HUB_PEERING || '{"enabled":false,"vpc_id":"","cidr_block":"","route_table_ids":[]}' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Initialize remote state
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: >-
          terraform init -reconfigure -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=spoke-phase5-phase6-phase7/terraform.tfstate"
          -backend-config="region=$AWS_REGION"
          -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE"
          -backend-config="encrypt=true"

      - name: Create Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply Terraform plan
        if: inputs.action == 'apply'
        run: terraform apply -input=false -auto-approve tfplan
